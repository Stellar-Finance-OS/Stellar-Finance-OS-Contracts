[workspace]
resolver = "2"
members = ["contracts/*", "packages/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/Stellar-Finance-OS/Stellar-Finance-OS-Contracts"
rust-version = "1.84"

[workspace.dependencies]
# Pinned to the latest stable release at scaffold time (2026-11-03).
soroban-sdk = "29.0.1"
finance-os-common = { path = "packages/common" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

# README §5: checked arithmetic everywhere. Unchecked +, -, *, /, casts that
# can truncate, and unwrap/expect/panic in non-test code are denied.
[workspace.lints.clippy]
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
unwrap_used = "deny"
panic = "deny"

# Release profile recommended by the Stellar docs for Soroban contracts.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Same as release but keeps diagnostic logs (`stellar contract build --profile release-with-logs`).
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
