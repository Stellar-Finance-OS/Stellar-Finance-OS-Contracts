name: Release

# On a semver tag (v1.2.3), build both contracts with the pinned Stellar CLI
# and publish the Wasm plus SHA-256 checksums as a GitHub release. The
# checksums are what an auditor or deployer compares against on-chain hashes.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - uses: stellar/stellar-cli@v30.0.1

      - name: Test
        run: cargo test

      - name: Build
        run: ./scripts/build.sh

      - name: Checksums
        working-directory: target/wasm32v1-none/release
        run: sha256sum *.wasm | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            target/wasm32v1-none/release/*.wasm \
            target/wasm32v1-none/release/SHA256SUMS
