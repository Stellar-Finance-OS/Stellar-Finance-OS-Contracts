name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt + clippy + test
        run: ./scripts/check.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - uses: stellar/stellar-cli@v30.0.1
      - name: stellar contract build
        run: ./scripts/build.sh
      - name: Wasm size limit (64 KiB network max)
        run: |
          for f in target/wasm32v1-none/release/*.wasm; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt 65536 ]; then
              echo "::error file=$f::$size bytes exceeds the 64 KiB contract size limit"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: target/wasm32v1-none/release/*.wasm

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage
        run: ./scripts/coverage.sh --html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit (RustSec advisories)
        run: cargo audit
